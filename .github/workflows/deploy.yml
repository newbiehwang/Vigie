name: Deploy

# main에 머지되거나 수동 실행하면 dev에 배포하고, prod는 GitHub Environment 승인 후 배포한다.
# 수동 실행도 입력값 없이 같은 경로를 따른다 (입력값에 따라 배포 결과가 달라지지 않도록).
# 저장소 변수 AWS_DEPLOY_ROLE_ARN_DEV / AWS_DEPLOY_ROLE_ARN_PROD가 없으면 해당 작업은 건너뛴다
# (cloudformation/github-oidc.yaml로 Role을 만든 뒤 변수를 등록해야 배포가 시작된다).
# dev/prod Environment는 배포 브랜치를 main으로 제한해야 한다. 수동 실행은 브랜치를 고를 수 있으므로
# 제한이 없으면 리뷰받지 않은 브랜치의 코드도 OIDC 신뢰 정책(environment:<env>)을 통과한다.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    name: dev 배포
    if: vars.AWS_DEPLOY_ROLE_ARN_DEV != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false   # 스택 업데이트 도중 취소되면 중간 상태로 남으므로 대기열로 처리
    permissions:
      contents: read
      id-token: write   # GitHub OIDC 토큰 발급 (장기 Access Key 미사용)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Lambda Layer 패키징용 pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
          role-session-name: vigie-deploy-dev-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          role-duration-seconds: 7200
      - name: deploy.sh dev
        run: ./deploy.sh dev
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}

  prod:
    name: prod 배포 (승인 필요)
    needs: dev
    # dev 배포가 성공한 뒤에만 진행
    if: vars.AWS_DEPLOY_ROLE_ARN_PROD != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod   # Environment 설정의 Required reviewers가 승인해야 작업이 시작된다
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          role-session-name: vigie-deploy-prod-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          role-duration-seconds: 7200
      - name: deploy.sh prod
        run: ./deploy.sh prod
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
