[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "installer/core"]   # .: 로컬 실행 패키지(local), installer/core: 설치 마법사 패키지(vigie_installer)
addopts = "-q"

[tool.ruff]
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
# 실제 결함으로 이어지는 규칙만 CI에서 강제한다 (문법 오류, 정의되지 않은 이름, 잘못된 비교 등)
select = ["E9", "F63", "F7", "F82"]
