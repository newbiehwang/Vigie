AWSTemplateFormatVersion: '2010-09-09'
Description: 'Vigie - Base Infrastructure CloudFormation Template'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: The deployment environment

  BucketExists:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  OutputBucketExists:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  AthenaOutputBucketExists:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  GuardDutyExportBucketExists:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  DockerBuildBucketExists:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  FrontendBucketExists:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  DiagramBucketExists:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  FrontendRedirectDomain:
    Type: String
    Default: placeholder.example.com
    Description: Amplify frontend redirect

  CallbackDomain:
    Type: String
    Default: placeholder.example.com/callback
    Description: Slackbot callback domain

  KnowledgeBaseId:
    Type: String
    Default: 9LLPTTVGDT
    Description: KnowledgeBaseId

  McpFunctionUrl:
    Type: String
    Default: placeholder.example.com
    Description: McpFunctionUrl

  # 인증 메일 Lambda 코드의 버전 (deploy.sh가 배포 버킷에 auth-messages/…-<버전>.zip으로 올린 뒤 넘긴다).
  # 비어 있으면 Lambda 없이 Cognito 기본 메일을 쓴다. 처음 만들 때는 배포 버킷이 아직 없어 비워 두고, 버킷이 생긴 뒤의 업데이트에서 채운다
  CodeVersion:
    Type: String
    Default: ''
    Description: Code version of the Cognito custom message Lambda package (empty = default Cognito emails)

Conditions:
  ShouldCreateBucket: !Equals [!Ref BucketExists, "false"]
  ShouldCreateOutputBucket: !Equals [!Ref OutputBucketExists, "false"]
  ShouldCreateAthenaOutputBucket: !Equals [!Ref AthenaOutputBucketExists, "false"]
  ShouldCreateGuardDutyExportBucket: !Equals [!Ref GuardDutyExportBucketExists, "false"]
  ShouldCreateDockerBuildBucket: !Equals [!Ref DockerBuildBucketExists, "false"]
  ShouldCreateFrontendBucket: !Equals [!Ref FrontendBucketExists, "false"]
  ShouldCreateDiagramBucket: !Equals [!Ref DiagramBucketExists, "false"]
  IsProd: !Equals [!Ref Environment, "prod"]
  IsTest: !Equals [!Ref Environment, "test"]
  IsDev: !Equals [!Ref Environment, "dev"]
  HasAuthMessages: !Not [!Equals [!Ref CodeVersion, ""]]

Resources:
  # S3 Buckets
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'vigie-deployment-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # 배포마다 코드 버전별 zip이 새로 올라오므로 오래된 빌드 산출물은 자동 정리한다
      # (롤백에 필요한 최근 산출물은 남기도록 90일 보관)
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldBuildArtifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment

  AthenaOutputBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateAthenaOutputBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'vigie-athenaoutputbucket-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        !If
        - ShouldCreateAthenaOutputBucket
        - Status: Enabled
        - !Ref "AWS::NoValue"
      BucketEncryption:
        !If
        - ShouldCreateAthenaOutputBucket
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        - !Ref "AWS::NoValue"
      # 모든 접근은 IAM(Lambda Role, Amplify 서비스 주체)으로만 이뤄지므로 퍼블릭 접근과 CORS 규칙이 필요 없다
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  OutputBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateOutputBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'vigie-outputbucket-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        !If
          - ShouldCreateOutputBucket
          - Status: Enabled
          - !Ref "AWS::NoValue"
      BucketEncryption:
        !If
          - ShouldCreateOutputBucket
          - ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          - !Ref "AWS::NoValue"
      # 모든 접근은 IAM(Lambda Role, Amplify 서비스 주체)으로만 이뤄지므로 퍼블릭 접근과 CORS 규칙이 필요 없다
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  GuardDutyExportBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateGuardDutyExportBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'vigie-guarddutyexportbucket-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        !If
        - ShouldCreateGuardDutyExportBucket
        - Status: Enabled
        - !Ref "AWS::NoValue"
      BucketEncryption:
        !If
        - ShouldCreateGuardDutyExportBucket
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        - !Ref "AWS::NoValue"
      # 모든 접근은 IAM(Lambda Role, Amplify 서비스 주체)으로만 이뤄지므로 퍼블릭 접근과 CORS 규칙이 필요 없다
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  DockerBuildBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateDockerBuildBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'vigie-dockerbuildbucket-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        !If
        - ShouldCreateDockerBuildBucket
        - Status: Enabled
        - !Ref "AWS::NoValue"
      BucketEncryption:
        !If
        - ShouldCreateDockerBuildBucket
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        - !Ref "AWS::NoValue"
      # 모든 접근은 IAM(Lambda Role, Amplify 서비스 주체)으로만 이뤄지므로 퍼블릭 접근과 CORS 규칙이 필요 없다
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateFrontendBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'vigie-frontend-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        !If
        - ShouldCreateFrontendBucket
        - Status: Enabled
        - !Ref "AWS::NoValue"
      BucketEncryption:
        !If
        - ShouldCreateFrontendBucket
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        - !Ref "AWS::NoValue"
      # 모든 접근은 IAM(Lambda Role, Amplify 서비스 주체)으로만 이뤄지므로 퍼블릭 접근과 CORS 규칙이 필요 없다
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  DiagramBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateDiagramBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'vigie-diagrambucket-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        !If
        - ShouldCreateDiagramBucket
        - Status: Enabled
        - !Ref "AWS::NoValue"
      BucketEncryption:
        !If
        - ShouldCreateDiagramBucket
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        - !Ref "AWS::NoValue"
      # 모든 접근은 IAM(Lambda Role, Amplify 서비스 주체)으로만 이뤄지므로 퍼블릭 접근과 CORS 규칙이 필요 없다
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: 'MCP Diagram Storage'

  # DynamoDB
  SlackbotSessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'SlackbotSessions-${Environment}'
      # 실수로 인한 삭제·덮어쓰기에 대비해 최근 35일 내 임의 시점으로 복구 가능
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # prod에서는 테이블 삭제 방지 (스택 삭제 전 수동으로 해제해야 함)
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: 'slack_user_id'
          AttributeType: S
      KeySchema:
        - AttributeName: 'slack_user_id'
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  AthenaTableRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'AthenaTableRegistry-${Environment}'
      # 실수로 인한 삭제·덮어쓰기에 대비해 최근 35일 내 임의 시점으로 복구 가능
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # prod에서는 테이블 삭제 방지 (스택 삭제 전 수동으로 해제해야 함)
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: 'log_type'
          AttributeType: S
      KeySchema:
        - AttributeName: 'log_type'
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'vigie-chat-history-${Environment}'
      # 실수로 인한 삭제·덮어쓰기에 대비해 최근 35일 내 임의 시점으로 복구 가능
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # prod에서는 테이블 삭제 방지 (스택 삭제 전 수동으로 해제해야 함)
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: 'sessionId'
          AttributeType: S
        - AttributeName: 'userId'
          AttributeType: S
      KeySchema:
        - AttributeName: 'sessionId'
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: 'UserIdIndex'
          KeySchema:
            - AttributeName: 'userId'
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  McpSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'vigie-mcp-sessions-${Environment}'
      # 실수로 인한 삭제·덮어쓰기에 대비해 최근 35일 내 임의 시점으로 복구 가능
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # prod에서는 테이블 삭제 방지 (스택 삭제 전 수동으로 해제해야 함)
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: 'session_id'
          AttributeType: S
      KeySchema:
        - AttributeName: 'session_id'
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: 'expires_at'
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: Vigie
        - Key: Purpose
          Value: MCP Session Management

  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'vigie-user-pool-${Environment}'
      # 로그인 화면을 새 managed login으로 꾸미려면(로고·색·한국어) Essentials 요금제가 필요하다.
      # Lite와 같이 월 활성 사용자 1만 명까지 무료이고, 넘으면 MAU당 요금이 Lite보다 비싸다 (https://aws.amazon.com/cognito/pricing/)
      UserPoolTier: ESSENTIALS
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      # 인증 메일(가입 인증·비밀번호 재설정·초대 등)을 메일마다 다른 제목·HTML 본문으로 만든다 (services/auth_messages)
      LambdaConfig: !If
        - HasAuthMessages
        - CustomMessage: !GetAtt AuthMessagesFunction.Arn
        - !Ref AWS::NoValue
      # 자체 가입을 연다. 가입한 사용자는 조회만 할 수 있고, AWS를 바꾸는 작업은 approvers 그룹이 승인해야 실행된다
      # (services/llm/approvals.py). 조회 범위(IAM 정책·버킷 목록·비용)는 docs/threat-model.md R2에 남은 위험으로 적었다
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        # 관리자가 만드는 계정(deploy.sh의 ADMIN_EMAIL, 사용자 관리 탭의 초대)에만 가는 초대 메일. 스스로 가입한 사용자는 받지 않는다.
        # Cognito는 아이디({username})와 임시 비밀번호({####}) 자리가 모두 있어야 받는다. 임시 비밀번호는 7일 동안 유효
        InviteMessageTemplate:
          EmailSubject: Vigie 계정이 만들어졌습니다
          EmailMessage: 'Vigie 계정이 만들어졌습니다. 아이디 {username} / 임시 비밀번호 {####} 로 로그인한 뒤 새 비밀번호를 정하세요. 임시 비밀번호는 7일 동안 쓸 수 있습니다.'
      UserPoolTags:
        Environment: !Ref Environment

  # ---- 인증 메일 (Cognito Custom message 트리거, services/auth_messages/lambda_function.py)
  # Cognito가 메일을 보내기 직전에 불러 제목·본문을 받는다. AWS를 부르지 않으므로 로그 쓰기 권한만 준다
  AuthMessagesRole:
    Type: AWS::IAM::Role
    Condition: HasAuthMessages
    Properties:
      RoleName: !Sub 'vigie-auth-messages-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AuthMessagesLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasAuthMessages
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs 기본 암호화를 쓴다. 고객 관리 KMS 키는 월 비용이 들어 두지 않는다
    Properties:
      LogGroupName: !Sub '/aws/lambda/vigie-auth-messages-${Environment}'
      RetentionInDays: 14

  AuthMessagesFunction:
    Type: AWS::Lambda::Function
    Condition: HasAuthMessages
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: Cognito가 동기로 부르고 결과를 바로 쓴다. 다시 처리할 비동기 이벤트가 없어 DLQ를 두지 않는다
          - id: CKV_AWS_117
            comment: AWS를 부르지 않고 글자만 만든다. VPC가 필요 없다
          - id: CKV_AWS_173
            comment: 환경 변수는 앱 주소와 로고 주소뿐이라 비밀이 없다
          - id: CKV_AWS_115
            comment: 가입·초대 때만 불리는 짧은 함수라 동시 실행 수를 따로 묶지 않는다 (계정 한도 안에서 돈다)
    Properties:
      FunctionName: !Sub 'vigie-auth-messages-${Environment}'
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: !Sub 'vigie-deployment-${AWS::AccountId}-${Environment}'
        S3Key: !Sub 'auth-messages/auth-messages-lambda-${Environment}-${CodeVersion}.zip'
      Timeout: 5
      MemorySize: 128
      Role: !GetAtt AuthMessagesRole.Arn
      TracingConfig:
        Mode: PassThrough
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AuthMessagesLogGroup
      Environment:
        Variables:
          # 초대 메일의 'Vigie 열기' 버튼과 메일 맨 위 로고 (프론트엔드에 올린 PNG: frontend/public/vigie-email-logo.png)
          APP_URL: !Sub 'https://${Environment}.${FrontendRedirectDomain}'
          LOGO_URL: !Sub 'https://${Environment}.${FrontendRedirectDomain}/vigie-email-logo.png'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Cognito(이 사용자 풀만)가 함수를 부를 수 있게 한다
  AuthMessagesPermission:
    Type: AWS::Lambda::Permission
    Condition: HasAuthMessages
    Properties:
      FunctionName: !GetAtt AuthMessagesFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # 관리자 그룹: 이 그룹의 사용자는 모든 사람의 감사 로그를 본다 (GET /audit).
  # 그룹 추가는 관리자가 사용자 관리 탭(services/llm/user_admin.py)이나 deploy.sh의 ADMIN_EMAIL로 한다 (가입만으로는 들어갈 수 없다)
  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: Vigie 관리자 (모든 사용자의 감사 로그 조회)
      UserPoolId: !Ref UserPool

  # 승인자 그룹: AI가 요청한 변경 작업(로그 보존 기간, 알람 알림, EC2 중지·시작, S3 퍼블릭 액세스 차단)을
  # 승인할 수 있다 (POST /actions/{id}/approve). 어느 환경이든 이 그룹만 승인하고, prod에서는 요청한 본인도
  # 승인할 수 없다 (직무 분리, services/llm/approvals.py)
  ApproversGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: approvers
      Description: Vigie 승인자 (AI가 요청한 변경 작업 승인)
      UserPoolId: !Ref UserPool

  # User Pool Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'vigie-app-client-${Environment}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub 'https://${Environment}.${FrontendRedirectDomain}/redirect'
        - !Sub 'https://${CallbackDomain}'
        - !Sub 'http://localhost:5173/redirect'
      LogoutURLs:
        - !Sub 'https://${Environment}.${FrontendRedirectDomain}/redirect'
        - !Sub 'http://localhost:5173/redirect'
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      PreventUserExistenceErrors: ENABLED

  # User Pool Domain. 로그인 화면은 새 managed login(2)으로 보인다 (예전 hosted UI(classic)는 1).
  # 앱은 로그인할 때 lang=ko를 붙여 한국어 화면을 연다 (frontend/src/auth/authClient.ts)
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'vigie-auth-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  # 로그인 화면 꾸미기 (managed login 스타일, 앱 클라이언트마다 하나). 앱과 같은 색·모서리, 로그인 상자 위에 Vigie 로고,
  # 뒤쪽에 파란·남색 번짐 배경 (앱이 Cognito로 넘어가기 전에 보이는 전환 화면과 같은 이미지라 두 화면이 이어져 보인다).
  # Cognito 페이지에는 CSS·스크립트를 넣을 수 없어, 전환 효과(나타나기)와 상자 그림자는 이 설정으로 만들 수 없다
  # - Settings: Cognito가 정한 형식의 JSON이다. 형식에 없는 값은 Cognito가 무시하므로, 여기에는 바꾸고 싶은 값만 적는다
  #   (나머지는 기본값). 색은 RRGGBBAA(끝 두 자리는 불투명도). 앱에 다크 모드가 없어 밝은 화면만 쓴다
  # - Assets: CloudFormation은 파일을 읽지 못해 이미지를 base64로 적는다. 원본은 frontend/src/assets/brand의 SVG이고
  #   scripts/cognito_branding.py가 만든다 (로고를 바꾸면 다시 만들어 붙인다. tests/test_managed_login.py가 어긋나면 알린다)
  # - 화면의 문구는 바꿀 수 없다 (Cognito 제약). 언어만 lang 파라미터로 고른다
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: false
      Settings:
        categories:
          global:
            colorSchemeMode: LIGHT
            spacingDensity: REGULAR
            pageHeader:
              enabled: false
            pageFooter:
              enabled: false
          form:
            displayGraphics: true
            sessionTimerDisplay: NONE
            instructions:
              enabled: false
            languageSelector:
              enabled: false
            location:
              horizontal: CENTER
              vertical: CENTER
        componentClasses:
          buttons:
            borderRadius: 10
          input:
            borderRadius: 10
        components:
          favicon:
            enabledTypes:
              - SVG
          pageBackground:
            image:
              enabled: true
            lightMode:
              color: f5f7faff
          form:
            borderRadius: 16
            backgroundImage:
              enabled: false
            logo:
              enabled: true
              location: CENTER
              position: TOP
              formInclusion: IN
            lightMode:
              backgroundColor: ffffffff
              borderColor: d6dee8ff
          primaryButton:
            lightMode:
              defaults:
                backgroundColor: 1e5aa8ff
                textColor: ffffffff
              hover:
                backgroundColor: 184a8cff
                textColor: ffffffff
              active:
                backgroundColor: 15427dff
                textColor: ffffffff
      Assets:
        - Category: FORM_LOGO
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 
        - Category: PAGE_BACKGROUND
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 
        - Category: FAVICON_SVG
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 

  # Identity Pool
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub 'vigie_identity_pool_${Environment}'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  # Identity Pool Role Attachment
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedUserRole.Arn

  # IAM Role for Authenticated Users
  AuthenticatedUserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'vigie-authenticated-user-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': authenticated
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'
      Policies:
        - PolicyName: !Sub 'vigie-authenticated-user-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:ListBucket'
                Resource:
                  !If
                    - ShouldCreateOutputBucket
                    -
                      - !GetAtt OutputBucket.Arn
                      - !Sub '${OutputBucket.Arn}/*'
                    -
                      - !Sub 'arn:aws:s3:::vigie-outputbucket-${Environment}'
                      - !Sub 'arn:aws:s3:::vigie-outputbucket-${Environment}/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # API Gateway
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'vigie-api-${Environment}'
      Description: 'Vigie API Gateway'
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # API Gateway에 대한 CORS 설정
  ApiGatewayCorsSettings:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${Environment}.${FrontendRedirectDomain}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        gatewayresponse.header.Access-Control-Allow-Credentials: "'true'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref ApiGateway

  # 5XX 오류에 대한 CORS 설정도 추가
  ApiGatewayCorsSettings5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${Environment}.${FrontendRedirectDomain}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        gatewayresponse.header.Access-Control-Allow-Credentials: "'true'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref ApiGateway

  # Cognito Authorizer
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoAuth
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      RestApiId: !Ref ApiGateway
      ProviderARNs:
        - !GetAtt UserPool.Arn

  CognitoAuthorizerIdParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/CognitoAuthorizerId'
      Type: String
      Value: !Ref CognitoAuthorizer
      Description: API Gateway Cognito User Pool Authorizer ID

  # SSM Parameters
  DeploymentBucketParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/DeploymentBucketName'
      Type: String
      Value: !If [ShouldCreateBucket, !Ref DeploymentBucket, !Sub 'vigie-deployment-${AWS::AccountId}-${Environment}']
      Description: Name of the S3 bucket for deployment packages

  OutputBucketParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/OutputBucketName'
      Type: String
      Value: !If [ShouldCreateOutputBucket, !Ref OutputBucket, !Sub 'vigie-outputbucket-${AWS::AccountId}-${Environment}']
      Description: Name of the S3 bucket for output files

  AthenaOutputBucketParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/AthenaOutputBucketName'
      Type: String
      Value: !If [ShouldCreateAthenaOutputBucket, !Ref AthenaOutputBucket, !Sub 'vigie-athenaoutputbucket-${AWS::AccountId}-${Environment}']
      Description: S3 bucket for Athena query results

  GuardDutyExportBucketParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/GuardDutyExportBucketName'
      Type: String
      Value: !If [ShouldCreateGuardDutyExportBucket, !Ref GuardDutyExportBucket, !Sub 'vigie-guarddutyexportbucket-${AWS::AccountId}-${Environment}']
      Description: S3 bucket for GuardDuty Export

  DockerBuildBucketParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/DockerBuildBucketName'
      Type: String
      Value: !If [ ShouldCreateDockerBuildBucket, !Ref DockerBuildBucket, !Sub 'vigie-dockerbuildbucket-${AWS::AccountId}-${Environment}' ]
      Description: S3 bucket for Docker Build

  FrontendBucketParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/FrontendBucketName'
      Type: String
      Value: !If [ ShouldCreateFrontendBucket, !Ref FrontendBucket, !Sub 'vigie-frontend-${AWS::AccountId}-${Environment}' ]
      Description: S3 bucket for frontend hosting

  DiagramBucketParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/DiagramBucketName'
      Type: String
      Value: !If [ ShouldCreateDiagramBucket, !Ref DiagramBucket, !Sub 'vigie-diagrambucket-${AWS::AccountId}-${Environment}' ]
      Description: S3 bucket for MCP diagram storage

  UserPoolIdParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/UserPoolId'
      Type: String
      Value: !Ref UserPool
      Description: ID of the Cognito User Pool

  UserPoolClientIdParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/UserPoolClientId'
      Type: String
      Value: !Ref UserPoolClient
      Description: ID of the Cognito User Pool Client

  UserPoolDomainParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/UserPoolDomain'
      Type: String
      Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
      Description: Domain of the Cognito User Pool

  IdentityPoolIdParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/IdentityPoolId'
      Type: String
      Value: !Ref IdentityPool
      Description: ID of the Cognito Identity Pool

  ApiGatewayIdParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/ApiGatewayId'
      Type: String
      Value: !Ref ApiGateway
      Description: ID of the API Gateway

  ApiGatewayRootResourceIdParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/ApiGatewayRootResourceId'
      Type: String
      Value: !GetAtt ApiGateway.RootResourceId
      Description: Root Resource ID of the API Gateway

  FrontendRedirectDomainParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/FrontendRedirectDomain'
      Type: String
      Value: !Ref FrontendRedirectDomain
      Description: Frontend redirect domain

  CallbackDomainParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/CallbackDomain'
      Type: String
      Value: !Ref CallbackDomain
      Description: Slackbot callback domain

  KnowledgeBaseIdParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/KnowledgeBaseId'
      Type: String
      Value: !Ref KnowledgeBaseId
      Description: KnowledgeBaseId

  McpFunctionUrlParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/McpFunctionUrl'
      Type: String
      Value: !Ref McpFunctionUrl
      Description: McpFunctionUrl

  ChatHistoryTableParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/ChatHistoryTable'
      Type: String
      Value: !Ref ChatHistoryTable
      Description: 'Name of the DynamoDB table for chat history'

  McpSessionsTableParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub '/vigie/${Environment}/McpSessionsTable'
      Type: String
      Value: !Ref McpSessionsTable
      Description: 'Name of the DynamoDB table for mcp sessions'

Outputs:

  CognitoAuthorizerId:
    Description: API Gateway Cognito User Pool Authorizer ID
    Value: !Ref CognitoAuthorizer
  DeploymentBucketName:
    Description: Name of the S3 bucket for deployment packages
    Value: !If [ShouldCreateBucket, !Ref DeploymentBucket, !Sub 'vigie-deployment-${AWS::AccountId}-${Environment}']

  OutputBucketName:
    Description: Name of the S3 bucket for output files
    Value: !If [ShouldCreateOutputBucket, !Ref OutputBucket, !Sub 'vigie-outputbucket-${AWS::AccountId}-${Environment}']

  AthenaOutputBucketName:
    Description: Name of the S3 bucket for athena output files
    Value: !If [ShouldCreateAthenaOutputBucket, !Ref AthenaOutputBucket, !Sub 'vigie-athenaoutputbucket-${AWS::AccountId}-${Environment}']

  GuardDutyExportBucketName:
    Description: Name of the S3 bucket for guardduty export files
    Value: !If [ShouldCreateGuardDutyExportBucket, !Ref GuardDutyExportBucket, !Sub 'vigie-guarddutyexportbucket-${AWS::AccountId}-${Environment}']

  DockerBuildBucketName:
    Description: Name of the S3 bucket for docker build files
    Value: !If [ ShouldCreateDockerBuildBucket, !Ref DockerBuildBucket, !Sub 'vigie-dockerbuildbucket-${AWS::AccountId}-${Environment}' ]

  FrontendBucketName:
    Description: Name of the S3 bucket for frontend hosting
    Value: !If [ShouldCreateFrontendBucket, !Ref FrontendBucket, !Sub 'vigie-frontend-${AWS::AccountId}-${Environment}']

  DiagramBucketName:
    Description: Name of the S3 bucket for MCP diagram storage
    Value: !If [ShouldCreateDiagramBucket, !Ref DiagramBucket, !Sub 'vigie-diagrambucket-${AWS::AccountId}-${Environment}']

  UserPoolId:
    Description: ID of the Cognito User Pool
    Value: !Ref UserPool

  UserPoolClientId:
    Description: ID of the Cognito User Pool Client
    Value: !Ref UserPoolClient

  UserPoolDomain:
    Description: Domain of the Cognito User Pool
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'

  IdentityPoolId:
    Description: ID of the Cognito Identity Pool
    Value: !Ref IdentityPool

  ApiGatewayId:
    Description: ID of the API Gateway
    Value: !Ref ApiGateway

  ApiGatewayRootResourceId:
    Description: Root Resource ID of the API Gateway
    Value: !GetAtt ApiGateway.RootResourceId

  FrontendRedirectDomain:
    Description: Placeholder for frontend redirect domain
    Value: !Ref FrontendRedirectDomain

  CallbackDomain:
    Description: Placeholder for slackbot callback domain
    Value: !Ref CallbackDomain

  KnowledgeBaseId:
    Description: KnowledgeBaseId
    Value: !Ref KnowledgeBaseId

  McpFunctionUrl:
    Description: Placeholder for McpFunctionUrl
    Value: !Ref McpFunctionUrl