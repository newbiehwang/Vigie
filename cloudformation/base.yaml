Outputs:

  CognitoAuthorizerId:
    Description: API Gateway Cognito User Pool Authorizer ID
    Value: !Ref CognitoAuthorizer
  DeploymentBucketName:
    Description: Name of the S3 bucket for deployment packages
    Value: !If [ShouldCreateBucket, !Ref DeploymentBucket, !Sub 'vigie-deployment-${AWS::AccountId}-${Environment}']

  OutputBucketName:
    Description: Name of the S3 bucket for output files
    Value: !If [ShouldCreateOutputBucket, !Ref OutputBucket, !Sub 'vigie-outputbucket-${AWS::AccountId}-${Environment}']

  AthenaOutputBucketName:
    Description: Name of the S3 bucket for athena output files
    Value: !If [ShouldCreateAthenaOutputBucket, !Ref AthenaOutputBucket, !Sub 'vigie-athenaoutputbucket-${AWS::AccountId}-${Environment}']

  GuardDutyExportBucketName:
    Description: Name of the S3 bucket for guardduty export files
    Value: !If [ShouldCreateGuardDutyExportBucket, !Ref GuardDutyExportBucket, !Sub 'vigie-guarddutyexportbucket-${AWS::AccountId}-${Environment}']

  DockerBuildBucketName:
    Description: Name of the S3 bucket for docker build files
    Value: !If [ ShouldCreateDockerBuildBucket, !Ref DockerBuildBucket, !Sub 'vigie-dockerbuildbucket-${AWS::AccountId}-${Environment}' ]

  FrontendBucketName:
    Description: Name of the S3 bucket for frontend hosting
    Value: !If [ShouldCreateFrontendBucket, !Ref FrontendBucket, !Sub 'vigie-frontend-${AWS::AccountId}-${Environment}']

  DiagramBucketName:
    Description: Name of the S3 bucket for MCP diagram storage
    Value: !If [ShouldCreateDiagramBucket, !Ref DiagramBucket, !Sub 'vigie-diagrambucket-${AWS::AccountId}-${Environment}']

  UserPoolId:
    Description: ID of the Cognito User Pool
