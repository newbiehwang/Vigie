AWSTemplateFormatVersion: "2010-09-09"
Description: "Vigie Slackbot Service CloudFormation Template"

Parameters:
    Environment:
        Type: String
        Description: The deployment environment

    ApiEndpointParameter:
        Type: String
        Description: API Endpoint

    ApiGatewayId:
        Type: String
        Description: API Gateway ID

    ApiGatewayRootResourceId:
        Type: String
        Description: API Gateway Root Resource ID

    CognitoClientIdSSMPath:
        Type: String
        Description: ID of the Cognito User Pool Client

    CognitoDomainSSMPath:
        Type: String
        Description: Domain of the Cognito User Pool

    CodeVersion:
        Type: String
        Description: 배포 코드 버전 (Lambda zip S3 키에 포함되어 배포마다 새 코드가 반영되게 함)

Resources:
    SlackbotLambdaExecutionRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: !Sub "vigie-slackbot-execution-role-${Environment}"
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
            Policies:
                - PolicyName: SlackbotLambdaAccessSSM
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogGroup
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: "*"
                          - Effect: Allow
                            Action:
                                - ssm:GetParameter
                                - ssm:GetParameters
                                - ssm:GetParametersByPath
                                - kms:Decrypt
                            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vigie/${Environment}/*"

                - PolicyName: SlackbotDynamoDBSessionAccess
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - dynamodb:PutItem
                                - dynamodb:GetItem
                                - dynamodb:DeleteItem
                                - dynamodb:UpdateItem
                            Resource:
                                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SlackbotSessions-${Environment}"
                                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/slack_user_settings"

                # /llm1을 공개 API(Cognito 인증) 대신 LLM Lambda 직접 호출로 요청
                - PolicyName: SlackbotInvokeLlm
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - lambda:InvokeFunction
                            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:vigie-llm-${Environment}"

    SlackbotLambdaLayer:
        Type: AWS::Lambda::LayerVersion
        Properties:
            LayerName: !Sub "slackbot-layer-${Environment}"
            Description: Common Python dependencies
            Content:
                S3Bucket: !Sub "vigie-deployment-${AWS::AccountId}-${Environment}"
                S3Key: !Sub "layers/common-layer-${Environment}-${CodeVersion}.zip"
            CompatibleRuntimes:
                - python3.12

    SlackbotLambdaFunction:
        Type: AWS::Lambda::Function
        Properties:
            FunctionName: !Sub "vigie-slackbot-${Environment}"
            Runtime: python3.12
            Handler: lambda_function.lambda_handler
            Code:
                S3Bucket: !Sub "vigie-deployment-${AWS::AccountId}-${Environment}"
                S3Key: !Sub "slackbot/slackbot-lambda-${Environment}-${CodeVersion}.zip"
            Layers:
                - !Ref SlackbotLambdaLayer
            Timeout: 15
            MemorySize: 256
            Role: !GetAtt SlackbotLambdaExecutionRole.Arn
            # X-Ray 추적과 JSON 구조화 로그 (REPORT 레코드의 initDurationMs로 콜드 스타트 측정 가능)
            TracingConfig:
              Mode: Active
            LoggingConfig:
              LogFormat: JSON
              ApplicationLogLevel: INFO
              SystemLogLevel: INFO
            Environment:
                Variables:
                    ENV: !Ref Environment
                    LLM_FUNCTION_NAME: !Sub "vigie-llm-${Environment}"
            Tags:
                - Key: Environment
                  Value: !Ref Environment

    SlackbotLoginApiResource:
        Type: AWS::ApiGateway::Resource
        Properties:
            RestApiId: !Ref ApiGatewayId
            ParentId: !Ref ApiGatewayRootResourceId
            PathPart: "login"

    SlackbotLoginMethod:
        Type: AWS::ApiGateway::Method
        Properties:
            RestApiId: !Ref ApiGatewayId
            ResourceId: !Ref SlackbotLoginApiResource
            HttpMethod: POST
            AuthorizationType: NONE
            Integration:
                Type: AWS_PROXY
                IntegrationHttpMethod: POST
                Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SlackbotLambdaFunction.Arn}/invocations"
            MethodResponses:
                - StatusCode: "200"

    SlackbotCallbackApiResource:
        Type: AWS::ApiGateway::Resource
        Properties:
            RestApiId: !Ref ApiGatewayId
            ParentId: !Ref ApiGatewayRootResourceId
            PathPart: "callback"

    SlackbotCallbackMethod:
        Type: AWS::ApiGateway::Method
        Properties:
            RestApiId: !Ref ApiGatewayId
            ResourceId: !Ref SlackbotCallbackApiResource
            HttpMethod: GET
            AuthorizationType: NONE
            Integration:
                Type: AWS_PROXY
                IntegrationHttpMethod: POST
                Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SlackbotLambdaFunction.Arn}/invocations"
            MethodResponses:
                - StatusCode: "200"
    # Events
    SlackbotEventsApiResource:
        Type: AWS::ApiGateway::Resource
        Properties:
            RestApiId: !Ref ApiGatewayId
            ParentId: !Ref ApiGatewayRootResourceId
            PathPart: "events"

    SlackbotEventsMethod:
        Type: AWS::ApiGateway::Method
        Properties:
            RestApiId: !Ref ApiGatewayId
            ResourceId: !Ref SlackbotEventsApiResource
            HttpMethod: POST
            AuthorizationType: NONE
            Integration:
                Type: AWS_PROXY
                IntegrationHttpMethod: POST
                Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SlackbotLambdaFunction.Arn}/invocations"
            MethodResponses:
                - StatusCode: "200"

    # slack-interaction
    SlackbotInteractionApiResource:
        Type: AWS::ApiGateway::Resource
        Properties:
            RestApiId: !Ref ApiGatewayId
            ParentId: !Ref ApiGatewayRootResourceId
            PathPart: "slack-interactions"

    SlackbotInteractionMethod:
        Type: AWS::ApiGateway::Method
        Properties:
            RestApiId: !Ref ApiGatewayId
            ResourceId: !Ref SlackbotInteractionApiResource
            HttpMethod: POST
            AuthorizationType: NONE
            Integration:
                Type: AWS_PROXY
                IntegrationHttpMethod: POST
                Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SlackbotLambdaFunction.Arn}/invocations"
            MethodResponses:
                - StatusCode: "200"

    SlackbotLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: "lambda:InvokeFunction"
            FunctionName: !Ref SlackbotLambdaFunction
            Principal: "apigateway.amazonaws.com"
            SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/POST/login"

    SlackbotCallbackLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: "lambda:InvokeFunction"
            FunctionName: !Ref SlackbotLambdaFunction
            Principal: "apigateway.amazonaws.com"
            SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/GET/callback"

    SlackbotEventsLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: "lambda:InvokeFunction"
            FunctionName: !Ref SlackbotLambdaFunction
            Principal: "apigateway.amazonaws.com"
            SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/POST/events"

    SlackbotInteractionLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            Action: "lambda:InvokeFunction"
            FunctionName: !Ref SlackbotLambdaFunction
            Principal: "apigateway.amazonaws.com"
            SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/POST/slack-interactions"
