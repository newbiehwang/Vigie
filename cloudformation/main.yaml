AWSTemplateFormatVersion: "2010-09-09"
Description: "Vigie - Main CloudFormation Template"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: The deployment environment

  McpImageUri:
    Type: "String"
    Description: ECR URI for MCP Lambda Docker image (코드 버전 태그 포함)

  CodeVersion:
    Type: String
    Description: 배포 코드 버전 (deploy.sh가 git 커밋 SHA로 지정)

  DeveloperMode:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable developer mode (disables zero trust evaluation)

  # 파라미터 정의를 SSM 참조 방식으로 변경
  UserPoolId:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: ID of the Cognito User Pool

  UserPoolClientId:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: ID of the Cognito User Pool Client

  UserPoolDomain:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Domain of the Cognito User Pool

  IdentityPoolId:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: ID of the Cognito Identity Pool

  OutputBucketName:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Name of the output S3 bucket

  ApiGatewayIdParameter:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: ID of the API Gateway

  ApiGatewayRootResourceIdParameter:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Root Resource ID of the API Gateway

  FrontendRedirectDomainParameter:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Frontend redirect domain

  AthenaOutputBucketParameter:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Athena Output Bucket Parameter

  KnowledgeBaseIdParameter:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Knowledge Base ID

  CognitoAuthorizerIdParameter:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: API Gateway Cognito User Pool Authorizer ID


  AlarmEmail:
    Type: String
    Default: ""
    Description: CloudWatch 알람을 받을 이메일 주소 (비워 두면 구독 없이 SNS 토픽만 생성)
Resources:
  LlmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://vigie-cloudformation-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com/llm.yaml"
      Parameters:
        Environment: !Ref Environment
        CodeVersion: !Ref CodeVersion
        ApiGatewayId: !Ref ApiGatewayIdParameter
        ApiGatewayRootResourceId: !Ref ApiGatewayRootResourceIdParameter
        FrontendRedirectDomain: !Ref FrontendRedirectDomainParameter
        McpImageUri: !Ref McpImageUri # << 이 줄 추가
        KnowledgeBaseIdParameter: !Ref KnowledgeBaseIdParameter
        CognitoAuthorizerId: !Ref CognitoAuthorizerIdParameter
        UserPoolId: !Ref UserPoolId # 사용자 관리 Lambda (user_admin.py)
      Tags:
        - Key: Environment
          Value: !Ref Environment

  DBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://vigie-cloudformation-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com/logs.yaml"
      Parameters:
        Environment: !Ref Environment
        CodeVersion: !Ref CodeVersion
        ApiGatewayId: !Ref ApiGatewayIdParameter
        ApiGatewayRootResourceId: !Ref ApiGatewayRootResourceIdParameter
        FrontendRedirectDomain: !Ref FrontendRedirectDomainParameter
        AthenaOutputBucketName: !Ref AthenaOutputBucketParameter
      Tags:
        - Key: Environment
          Value: !Ref Environment

  SlackbotStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://vigie-cloudformation-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com/slackbot.yaml"
      Parameters:
        Environment: !Ref Environment
        CodeVersion: !Ref CodeVersion
        ApiGatewayId: !Ref ApiGatewayIdParameter
        ApiGatewayRootResourceId: !Ref ApiGatewayRootResourceIdParameter
        ApiEndpointParameter: !Ref ApiEndpointParameter
        CognitoClientIdSSMPath: !Ref UserPoolClientId
        CognitoDomainSSMPath: !Ref UserPoolDomain
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ChatHistoryStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://vigie-cloudformation-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com/chat-history.yaml"
      Parameters:
        Environment: !Ref Environment
        CodeVersion: !Ref CodeVersion
        ApiGatewayId: !Ref ApiGatewayIdParameter
        ApiGatewayRootResourceId: !Ref ApiGatewayRootResourceIdParameter
        FrontendRedirectDomain: !Ref FrontendRedirectDomainParameter
        CognitoAuthorizerId: !Ref CognitoAuthorizerIdParameter
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ApiEndpointParameter:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Delete
    Properties:
      Name: !Sub "/vigie/${Environment}/ApiEndpoint"
      Type: String
      Value: !Sub "https://${ApiGatewayIdParameter}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Description: API Gateway endpoint URL

  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://vigie-cloudformation-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com/monitoring.yaml"
      Parameters:
        Environment: !Ref Environment
        AlarmEmail: !Ref AlarmEmail
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ApiGatewayFinalDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - LlmStack
      - DBStack
      - SlackbotStack
      - ChatHistoryStack
    Properties:
      RestApiId: !Ref ApiGatewayIdParameter
      StageName: !Ref Environment

Outputs:
  CognitoDomain:
    Description: Cognito User Pool Domain
    Value: !Ref UserPoolDomain

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClientId

  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayIdParameter}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
